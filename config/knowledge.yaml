# X4 Knowledge Library 設定。既存ニュース(config/sources.yaml)とは独立。
# 数字や題材を変えるときはここだけ編集する。

site_base_url: "https://gigabiter-v2.github.io/news-library"

# --- Gemini ---------------------------------------------------------------
# 執筆・事実抽出役。混雑/割当超過のとき fallback_models を順に試す。
# 無料枠のAPIキーは「モデル系統ごとに1日20リクエスト」まで（太平洋時間0時=日本時間17時にリセット）。
# 1冊で約5〜8回呼ぶ。3.7 は 3.8、3.5-flash は 3.6-flash と同じ枠(自動転送)なので、並べても予備にならない。
# 3.6 系統(3.5-flash を含む)は既存のニュース配信が毎朝使うので、この図書館のモデル列には入れない。
model: "gemini-3.8-flash"
fallback_models: ["gemini-3-flash-preview", "gemini-3.5-flash-lite"]
# 事実監査・原稿校閲役は、執筆役とは別モデルを先に使う（同じ癖での見落としを減らす）。
audit_model: "gemini-3-flash-preview"
audit_fallback_models: ["gemini-3.8-flash", "gemini-3.1-flash-lite", "gemini-3.5-flash-lite"]
gemini_interval_seconds: 6      # 呼び出し間隔（分間上限対策）
# 資料探しの方式。false=Wikipedia記事とその参考文献リンクから探す（無料枠のAPIキーで動く）。
# true=Google検索グラウンディングで探す（課金設定済みのキーが必要。無料枠では全呼び出しが429になる）。
search_grounding: false
max_output_tokens: 32768        # 思考トークンを含む出力上限

# --- 出版ルール -------------------------------------------------------------
article_min_chars: 1200         # 本文の下限(約2.5分)。厳密な長さは求めず、短すぎる本だけ弾く。校閲で指摘文を削ると短くなるため下げた
article_max_chars: 7000         # 本文の上限。約14分
fact_min: 8                     # 原文照合を通過した事実カードの最低数
source_min: 2                   # 独立した取得元ドメインの最低数
source_trusted_min: 1           # うち、官公庁・学会・大学・企業公式・主要報道・事典(信頼度0〜1)の最低数。Wikipediaだけでは出版しない
source_min_chars: 800            # Wikipedia起点の資料探しで、本文がこれより短いページ(目録レコード等)は出典にしない
max_new_per_run: 2              # 1回の実行で新規に調べる冊数上限（APIと時間の節約）
publish_per_day: 2              # 1日に公開する最大冊数（完成した本が溜まっていれば2冊まで出す）
stock_target: 3                 # 常に確保しておく未公開ストック数
max_published_in_feed: 120      # knowledge_feed.xml に載せる最大冊数

# 曜日ごとのジャンル（月曜〜日曜）。
