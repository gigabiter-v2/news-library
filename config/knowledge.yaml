  - biography     # 火: 人物・企業の伝記
  - business      # 水: ビジネス用語
  - outsourcing   # 木: 中材・受託会社側の経営
  - cases         # 金: 企業の成功・失敗
  - management    # 土: マネジメント・経営
  - discovery     # 日: 未知の教養（科学・歴史）

