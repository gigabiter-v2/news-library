# XTEINK X4 ニュース取得元設定 (2026-10-14 修正)
# 医療・金融リテラシーの無効な仮RSSを現行フィードに差し替え

weather:
  enabled: true
  area_code: "130000"
  area_name: "東京"
  url_template: "https://www.jma.go.jp/bosai/forecast/data/overview_forecast/{code}.json"

rss_feeds:
  - name: "NHKニュース 経済"
    url: "https://www.nhk.or.jp/rss/news/cat5.xml"
    category: "economy"
    enabled: true

  - name: "NHKニュース 主要"
    url: "https://www.nhk.or.jp/rss/news/cat0.xml"
    category: "general"
    enabled: true

  - name: "NHKニュース 科学・医療"
    url: "https://www.nhk.or.jp/rss/news/cat3.xml"
    category: "tech"
    enabled: true

  - name: "ITmedia NEWS"
    url: "https://rss.itmedia.co.jp/rss/2.0/news_bursts.xml"
    category: "tech"
    enabled: true

  - name: "NHKニュース 国際"
    url: "https://www.nhk.or.jp/rss/news/cat6.xml"
    category: "international"
    enabled: true

  - name: "NHKニュース 社会"
    url: "https://www.nhk.or.jp/rss/news/cat1.xml"
    category: "society"
    enabled: true

  - name: "CoinPost"
    url: "https://coinpost.jp/?feed=rss2"
    category: "crypto"
    enabled: true

  - name: "Response(自動車)"
    url: "http://response.jp/rss/index.rdf"
    category: "car"
    enabled: true

  # 日経メディカルの現行RSS（旧 /rss/all.rdf は無効）
  - name: "日経メディカル"
    url: "https://medical.nikkeibp.co.jp/all/info/feed/index.rdf"
    category: "medical"
    enabled: true

  # 金融庁の公式RSS（旧 /rss/news.rdf は無効）
  - name: "金融庁 新着情報"
    url: "https://www.fsa.go.jp/fsaNewsListAll_rss2.xml"
    category: "finance_literacy"
    enabled: true

  # 金融庁は行政発表が中心なので、実用的な投資知識を補う
  - name: "All About 投資"
    url: "https://rss.allabout.co.jp/aa/latest/ch/ch_investment/"
    category: "finance_literacy"
    enabled: true

keyword_filter:
  economy:
    - "日銀"
    - "株価"
    - "為替"
    - "物価"
    - "金利"
    - "決算"
  general:
    - "台風"
    - "地震"
    - "選挙"
  tech: []
  international: []
  society: []
  crypto: []
  car: []
  medical: []
  finance_literacy: []

summary_length: 350
max_articles_per_category: 15
lookback_hours: 72
candidate_per_category: 20
max_total_articles: 15
retain_days: 7
gemini_interval_seconds: 6
