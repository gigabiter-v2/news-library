name: Daily News Digest

on:
  schedule:
    # 毎日 JST 6:00 に実行 (UTC 21:00 = 前日)
    - cron: "0 21 * * *"
  workflow_dispatch: {}   # 手動実行ボタンを有効化

permissions:
  contents: write

jobs:
  build-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/build_digest.py

      - name: Commit and push
        run: |
          git config user.name "news-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add books/ feed.xml sent_articles.json
          git diff --cached --quiet || git commit -m "Daily digest: $(date -u +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
